name: check

# Unit tests, then scrape-check on two made-up shards (no real data), against a local stand-in for scrape-hub.
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -q -r requirements.txt pytest "scrape-hub-client @ git+https://github.com/s1d-labs/runner@sdk-stable#subdirectory=sdk"
      - name: Unit tests
        run: python -m pytest tests -q
      - name: scrape-check (local stand-in hub, made-up shards)
        run: >
          scrape-check --project bid-screens-gem --task screens --items 2 --env BID_SCREENS_MIN_BUDGET_MIN=2
          --item '{"key":"synthetic-1","payload":{"shard":"check/s1","source":"gem","synthetic":150}}'
          --item '{"key":"synthetic-2","payload":{"shard":"check/s2","source":"gepnic","synthetic":120}}'
